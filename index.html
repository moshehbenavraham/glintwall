<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1813" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Anti-FOUC bootstrap: apply the user's resolved theme synchronously
      before React paints, so dark-OS visitors don't see a flash of the
      light palette on first paint. Must run before any stylesheet that
      relies on the `.dark` class. Keep `storageKey` in sync with the
      value passed to <ThemeProvider> in src/App.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("visual-gallery-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            stored === "dark" || stored === "light"
              ? stored
              : prefersDark
              ? "dark"
              : "light";
          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          /* localStorage / matchMedia unavailable — fall back to light. */
        }
      })();
    </script>

    <title>Jamie Rodriguez — People Photographer & Storyteller</title>
    <meta name="description" content="Warm, natural photography by Jamie Rodriguez. Capturing authentic moments and genuine connections with people doing what they love." />
